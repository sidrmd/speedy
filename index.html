<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Speedy NDB</title>
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icone-192.png">
<link rel="manifest" href="saisie.webmanifest">
<meta name="apple-mobile-web-app-title" content="Speedy NDB">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="Speedy NDB">
<meta name="theme-color" content="#FFFFFF">
<style>
html, body { margin: 0; height: 100%; background: #fff; font-family: Calibri, Carlito, "Segoe UI", Roboto, Arial, sans-serif; color: #1B1B1B; }
.c { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; box-sizing: border-box; text-align: center; }
img { width: 180px; height: 180px; border-radius: 40px; box-shadow: 0 12px 30px -14px rgba(94,26,36,.5); }
a { color: #fff; background: linear-gradient(135deg, #C23A47, #5E1A24); text-decoration: none; font-weight: 800; padding: 13px 24px; border-radius: 16px; }
p { margin: 0; color: #6E6264; font-size: 14px; max-width: 22rem; }
#appli { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
@media (prefers-color-scheme: dark) { html, body, #appli { background: #121212; } }
</style>
</head>
<body>
<div class="c">
  <img src="icone-512.png" alt="Speedy">
  <a id="ouvrir" href="https://script.google.com/macros/s/AKfycbyZw78twmGT4iiryl9SSot7cj_SEea4raXtxM_wmlRca3U57Cksnn8WJAfnWrL08i5-/exec">Ouvrir Speedy NDB</a>
  <p id="aide">Pour l'icône : ajoutez cette page à l'écran d'accueil (Android : menu ⋮ puis « Ajouter à l'écran d'accueil » ; iPhone : Partager puis « Sur l'écran d'accueil »).</p>
</div>
<script>
// Ouverte depuis l'icône de l'écran d'accueil : on part directement dans l'appli.
// Ouverte normalement dans le navigateur : on reste ici pour pouvoir ajouter la page à l'écran d'accueil.
(() => {
  const depuisIcone = matchMedia('(display-mode: standalone)').matches || navigator.standalone || /[?&]icone=1/.test(location.search);
  if (!depuisIcone) return;
  const url = "https://script.google.com/macros/s/AKfycbyZw78twmGT4iiryl9SSot7cj_SEea4raXtxM_wmlRca3U57Cksnn8WJAfnWrL08i5-/exec";
  if (!true) { location.replace(url); return; }
  // L'appli est affichée dans cette page : elle reste en plein écran, sans barre de navigateur.
  const cadre = document.createElement('iframe');
  cadre.id = 'appli'; cadre.title = "Speedy NDB";
  cadre.allow = 'camera; clipboard-write; fullscreen';
  const vue = (v) => { cadre.src = url + (v === 'affiche' ? '?affiche=1&lanceur=1' : '?lanceur=1'); };
  vue('app');
  document.body.replaceChildren(cadre);
  addEventListener('message', (ev) => {
    if (!/\.googleusercontent\.com$|^https:\/\/script\.google\.com$/.test(ev.origin)) return;
    const d = ev.data || {};
    if (d.speedy === 'vue') vue(d.vue);
  });
})();
</script>
</body>
</html>
